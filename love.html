  <body class="flex min-h-dvh flex-col text-ink" data-theme="macaron">

          <form id="gateForm" class="mx-auto mt-8 w-full max-w-[420px]">

          <div class="mt-5 grid gap-2.5">
            <button type="button" data-option="0" class="option flex min-h-[56px] w-full items-center justify-between gap-3 rounded-[22px] border-2 border-white/60 bg-white/45 px-5 py-4 text-left text-base leading-6 backdrop-blur-md transition-colors hover:border-[#f0b7c9] hover:bg-white/75 active:border-[#e79bb3] active:bg-[#fde7ee]/90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#eaaebf] aria-pressed:border-[#efa9bf] aria-pressed:bg-[#fde7ee]/80"></button>
            <button type="button" data-option="1" class="option flex min-h-[56px] w-full items-center justify-between gap-3 rounded-[22px] border-2 border-white/60 bg-white/45 px-5 py-4 text-left text-base leading-6 backdrop-blur-md transition-colors hover:border-[#f0b7c9] hover:bg-white/75 active:border-[#e79bb3] active:bg-[#fde7ee]/90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#eaaebf] aria-pressed:border-[#efa9bf] aria-pressed:bg-[#fde7ee]/80"></button>
            <button type="button" data-option="2" class="option flex min-h-[56px] w-full items-center justify-between gap-3 rounded-[22px] border-2 border-white/60 bg-white/45 px-5 py-4 text-left text-base leading-6 backdrop-blur-md transition-colors hover:border-[#f0b7c9] hover:bg-white/75 active:border-[#e79bb3] active:bg-[#fde7ee]/90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#eaaebf] aria-pressed:border-[#efa9bf] aria-pressed:bg-[#fde7ee]/80"></button>
            <button type="button" data-option="3" class="option flex min-h-[56px] w-full items-center justify-between gap-3 rounded-[22px] border-2 border-white/60 bg-white/45 px-5 py-4 text-left text-base leading-6 backdrop-blur-md transition-colors hover:border-[#f0b7c9] hover:bg-white/75 active:border-[#e79bb3] active:bg-[#fde7ee]/90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#eaaebf] aria-pressed:border-[#efa9bf] aria-pressed:bg-[#fde7ee]/80"></button>

                <path fill="currentColor" d="M315.2 912.4c-18 0-36-7.6-48.6-22.4-23-26.8-19.9-67.2 6.9-90.2l336-288-336-288c-26.8-23-29.9-63.4-6.9-90.2 23-26.8 63.4-29.9 90.2-6.9l392.7 336.6c14.2 12.2 22.3 29.9 22.3 48.6s-8.2 36.4-22.3 48.6L356.8 897c-12 10.3-26.9 15.4-41.6 15.4z"/>
              </svg>
              上一题

        <section id="result" class="w-full text-center" hidden>
          <div id="radar" class="mx-auto h-[280px] w-full sm:h-[330px]" role="img" aria-label="六维心动雷达图"></div>

            <button id="restart" type="button" class="h-12 flex-1 rounded-full bg-[#e9defb] text-sm font-semibold text-ink transition-colors hover:bg-[#dfd2f7] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#bfd8f2]">再测一次</button>

    <footer class="w-full px-5 pb-[calc(14px+env(safe-area-inset-bottom))] pt-2 text-center text-xs text-muted">
      <p class="mx-auto max-w-[620px] leading-5">本测试仅供娱乐与自我参考，不构成心理评估或情感建议。请勿将测试结果作为现实关系决策的唯一依据。</p>
    </footer>

    <script src="assets/vendor/echarts.min.js"></script>
    <script src="assets/js/love-questions.js?v=pass1"></script>
    <script>
      const gateScreen = document.getElementById('gate');
      const quizScreen = document.getElementById('quiz');
      const resultScreen = document.getElementById('result');
      const gateForm = document.getElementById('gateForm');
      const passwordInput = document.getElementById('password');
      const gateHint = document.getElementById('gateHint');
      const progressLabel = document.getElementById('progress');
      const barFill = document.getElementById('barFill');
      const questionTitle = document.getElementById('question');
      const optionButtons = Array.from(document.querySelectorAll('[data-option]'));
      const optionsBox = optionButtons[0] && optionButtons[0].parentElement;
      const prevBtn = document.getElementById('prev');
      const radarEl = document.getElementById('radar');
      const scoreLabel = document.getElementById('score');
      const resultTitle = document.getElementById('resultTitle');
      const resultText = document.getElementById('resultText');
      const ORDERS = QUESTIONS.map(function (_, questionIndex) {
        return [0, 1, 2, 3].map(function (optionIndex) {
          return (optionIndex + questionIndex) % 4;
        });
      });

      let index = 0;
      let answers = new Array(QUESTIONS.length).fill(0);
      let radarChart = null;
      let locked = false;

      function show(screen) {
        [gateScreen, quizScreen, resultScreen].forEach(function (item) {
          item.hidden = item !== screen;
        });
        window.scrollTo({ top: 0 });
      }

      function renderQuestion() {
        progressLabel.textContent = '第 ' + (index + 1) + ' / ' + QUESTIONS.length + ' 题';
        barFill.style.width = ((index + 1) / QUESTIONS.length * 100) + '%';
        questionTitle.textContent = QUESTIONS[index];

        const order = ORDERS[index];
        optionButtons.forEach(function (button, optionIndex) {
          const option = OPTIONS[order[optionIndex]];
          button.textContent = option.label;
          button.classList.remove('is-picked');
          button.setAttribute('aria-pressed', String(answers[index] === option.score));
        });
        prevBtn.disabled = index === 0;
        if (optionsBox) optionsBox.classList.add('is-resetting');
      }

      function renderRadar(values, color) {
        if (!window.echarts) {
          radarEl.hidden = true;
          return;
        }
        radarEl.hidden = false;
        if (!radarChart) {
          radarChart = echarts.init(radarEl, null, { renderer: 'svg' });
        }
        radarChart.setOption({
          animation: false,
          radar: {
            center: ['50%', '52%'],
            radius: '68%',
            splitNumber: 4,
            indicator: DIMENSIONS.map(function (item) {
              return { name: item.name, max: 100 };
            }),
            axisName: { color: '#5b5470', fontSize: 13, fontWeight: 500 },
            axisLine: { lineStyle: { color: 'rgba(142, 201, 255, 0.55)' } },
            splitLine: { lineStyle: { color: 'rgba(185, 164, 238, 0.45)' } },
            splitArea: {
              areaStyle: { color: ['rgba(255, 255, 255, 0.35)', 'rgba(255, 255, 255, 0.12)'] }
            }
          },
          series: [{
            type: 'radar',
            symbolSize: 5,
            data: [{
              value: values,
              areaStyle: { color: color + '55' },
              lineStyle: { color: color, width: 2 },
              itemStyle: { color: color }
            }]
          }]
        }, true);
        requestAnimationFrame(function () { radarChart.resize(); });
      }

      function showResult() {
        const total = QUESTIONS.length * 4;
        const score = answers.reduce(function (sum, value) { return sum + value; }, 0);
        const result = RESULTS.find(function (item) {
          return score >= item.min && score <= item.max;
        });
        const values = DIMENSIONS.map(function (dimension) {
          const sum = dimension.indexes.reduce(function (acc, i) { return acc + answers[i]; }, 0);
          return Math.round(sum / (dimension.indexes.length * 4) * 100);
        });
        const topName = DIMENSIONS[values.indexOf(Math.max.apply(null, values))].name;

        scoreLabel.textContent = score + ' 分 / ' + total + ' · 最强信号：' + topName;
        resultTitle.textContent = result.title;
        resultText.textContent = result.text;
        show(resultScreen);
        renderRadar(values, result.color);
      }

      async function copyResult() {
        const text = resultTitle.textContent + '｜' + scoreLabel.textContent + '\n' + resultText.textContent + '\n\n—— 本测试仅供娱乐与自我参考，不构成专业心理或情感建议。';
        try {
          await navigator.clipboard.writeText(text);
        } catch (error) {
          const area = document.createElement('textarea');
          area.value = text;
          area.style.position = 'fixed';
          area.style.opacity = '0';
          document.body.appendChild(area);
          area.select();
          document.execCommand('copy');
          area.remove();
        }
        const copyBtn = document.getElementById('copy');
        copyBtn.textContent = '已复制';
        setTimeout(function () { copyBtn.textContent = '复制结果'; }, 1500);
      }

      function startQuiz() {
        index = 0;
        answers = new Array(QUESTIONS.length).fill(0);
        locked = false;
        show(quizScreen);
        renderQuestion();
      }

      function clearReset() {
        if (optionsBox) optionsBox.classList.remove('is-resetting');
      }

      gateHint.textContent = ACCESS_HINT;

      gateForm.addEventListener('submit', function (event) {
        event.preventDefault();
        // shortcut: client-side check only, readable in source; move to a server if this ever guards private data.
        if (passwordInput.value.trim() === ACCESS_PASSWORD) {
          startQuiz();
          return;
        }
        gateHint.textContent = '暗号不对，再试一次';
        gateHint.style.color = '#d0567c';
        passwordInput.select();
      });

      passwordInput.addEventListener('input', function () {
        gateHint.textContent = ACCESS_HINT;
        gateHint.style.color = '';
      });

      optionButtons.forEach(function (button, optionIndex) {
        button.addEventListener('click', function () {
          if (locked) return;
          locked = true;
          answers[index] = OPTIONS[ORDERS[index][optionIndex]].score;
          button.classList.add('is-tapped');
          setTimeout(function () { button.classList.remove('is-tapped'); }, 200);
          button.classList.add('is-picked');
          button.setAttribute('aria-pressed', 'true');
          setTimeout(function () {
            locked = false;
            if (index === QUESTIONS.length - 1) {
              showResult();
              return;
            }
            index += 1;
            renderQuestion();
          }, 260);
        });
      });

      prevBtn.addEventListener('click', function () {
        if (locked) return;
        if (index === 0) return;
        index -= 1;
        renderQuestion();
      });

      document.getElementById('restart').addEventListener('click', startQuiz);
      document.getElementById('copy').addEventListener('click', copyResult);
      document.addEventListener('pointermove', function (event) {
        if (event.pointerType !== 'touch') clearReset();
      }, { passive: true });
      document.addEventListener('pointerdown', function (event) {
        if (event.pointerType !== 'touch') clearReset();
      }, { passive: true });
      window.addEventListener('resize', function () {
        if (radarChart) radarChart.resize();
      });
    </script>
    <script src="assets/js/background.js?v=theme6"></script>
